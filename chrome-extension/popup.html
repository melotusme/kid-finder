<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>找娃助手</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #2b2b2b;
        background: #fffdf9;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 16px;
        color: #c2410c;
        display: flex;
        align-items: baseline;
        gap: 6px;
      }
      .ver {
        font-size: 12px;
        font-weight: 500;
        color: #9a3412;
        opacity: 0.75;
      }
      .card {
        background: #fff;
        border: 1px solid #f0e4d2;
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 10px;
      }
      .ok { color: #166534; font-weight: 600; }
      .err { color: #991b1b; font-weight: 600; }
      .err-box {
        margin-top: 6px;
        padding: 7px 9px;
        border-radius: 8px;
        font-size: 12px;
        background: #fef2f2;
        color: #991b1b;
        border: 1px solid #fecaca;
      }
      .tip {
        margin-top: 6px;
        padding: 6px 9px;
        border-radius: 8px;
        font-size: 11.5px;
        background: #eff6ff;
        color: #1e40af;
        border: 1px solid #bfdbfe;
      }
      .muted { color: #78716c; font-size: 12px; }
      button {
        width: 100%;
        border: none;
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        background: #f59e0b;
        color: #fff;
      }
      button:hover:not(:disabled) { filter: brightness(1.06); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <h1>找娃助手 · 群相册插件 <span id="ext-ver" class="ver"></span></h1>
    <div class="card" id="status">正在检查桌面端连接…</div>
    <button id="open">打开群相册网页 (qxc.hi.cn)</button>
    <script src="popup.js"></script>
  </body>
</html>
