[package]
name = "kid-finder"
version = "0.2.1"
description = "从老师发的照片/视频里找出自家宝宝"
license = "MIT"
edition = "2021"

[lib]
name = "kid_finder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream", "query"] }
futures-util = "0.3"
rusqlite = { version = "0.43", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
ort = { version = "=2.0.0-rc.15" }
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
